      - {name: abschluss_titel, label: Abschluss Titel, widget: string, required: false}
      - {name: abschluss_text, label: Abschluss Text, widget: text, required: false}
      - {name: naechstes_ziel, label: Nächstes Projekt (Datei), widget: string, required: false}
      - {name: naechstes_projekt, label: Nächstes Projekt (Name), widget: string, required: false}
    - name: einleitung
