      - {name: untertitel, label: Untertitel, widget: string, required: false}
      - {name: bild, label: Titelbild, widget: image}
      - {name: fokus, label: Bildausschnitt Titelbild (z. B. 50% 35%), widget: string, required: false}
      - {name: portraet_titel, label: Überschrift Projektbeschreibung, widget: string, required: false}
      - {name: text, label: Projektbeschreibung, widget: markdown, required: false}
      - name: fakten
        label: Fakten
