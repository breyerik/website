      - name: kennzahlen
        label: Kennzahlen
        widget: list
        required: false
        fields:
        - name: wert
          label: Wert
          widget: string
        - name: bezeichnung
          label: Bezeichnung
          widget: string
      - name: bild_fokus
        label: Bildausschnitt (z. B. 50% 40%)
        widget: string
        required: false
      - {name: ki_bild, label: KI-generiertes Bild kennzeichnen, widget: boolean, default: false, required: false}
      - {name: bild_platzhalter, label: Platzhaltertext (solange kein Bild gewählt ist), widget: string, required: false}
      - {name: bild_format, label: "Format des Platzhalters (z. B. 4/5)", widget: string, required: false}
      - name: stil
        label: Darstellung
        widget: select
        options:
        - angebot
        - referenz
        - portrait
        required: false
    - name: referenz_auswahl
