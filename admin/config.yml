# Sveltia CMS (kompatibel mit Decap CMS). Bearbeitet die Dateien in inhalt/.
backend:
  name: github
  repo: '[PLATZHALTER]/website'
  branch: main
media_folder: inhalt/bilder
public_folder: /bilder
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: seiten
  label: Seiten
  label_singular: Seite
  folder: inhalt/seiten
  format: json
  extension: json
  create: true
  identifier_field: titel
  slug: '{{fields.dateiname}}'
  fields:
  - name: titel
    label: Seitentitel
    widget: string
  - name: dateiname
    label: Dateiname (ohne .html)
    widget: string
    hint: index = Startseite
  - name: beschreibung
    label: Kurzbeschreibung für Google
    widget: text
    required: false
  - name: nicht_indexieren
    label: Nicht bei Google zeigen
    widget: boolean
    required: false
  - name: abschnitte
    label: Abschnitte
    label_singular: Abschnitt
    widget: list
    typeKey: typ
    hint: Abschnitte per Ziehen umsortieren, mit + neue Bausteine einfügen.
    types:
    - name: slideshow
      label: Slideshow (großer Bildauftakt)
      widget: object
      fields:
      - name: label
        label: Überzeile
        widget: string
        required: false
      - name: titel
        label: Titel (Zeilenumbruch erlaubt)
        widget: text
        required: false
      - name: text
        label: Kurzer Text
        widget: string
        required: false
      - name: button_text
        label: Knopftext
        widget: string
        required: false
      - name: button_ziel
        label: Knopf-Link
        widget: string
        required: false
      - name: zweiter_button_text
        label: Zweiter Knopf, Text
        widget: string
        required: false
      - name: zweiter_button_ziel
        label: Zweiter Knopf, Link
        widget: string
        required: false
      - name: nur_bilder
        label: Nur Bilder (ohne Text)
        widget: boolean
        default: false
        required: false
      - name: sekunden_pro_bild
        label: Sekunden pro Bild
        widget: number
        value_type: float
        default: 5.5
      - name: bilder
        label: Bilder
        widget: list
        fields:
        - name: bild
          label: Bild
          widget: image
        - name: titel
          label: Bildunterschrift
          widget: string
          required: false
        - name: alt
          label: Bildbeschreibung (für Blinde)
          widget: string
          required: false
        - name: fokus
          label: Bildausschnitt (z. B. 50% 40% = Mitte, etwas oberhalb)
          widget: string
          required: false
        - name: ziel
          label: Link der Bildunterschrift (z. B. referenz-bb-69.html)
          widget: string
          required: false
    - name: open_house
      label: Open House (Daten in Einstellungen)
      widget: object
      fields:
      - &id001
        name: anker
        label: Sprungziel (z. B. kontakt)
        widget: string
        required: false
      - &id002
        name: sprungmarke
        label: Name im Seitenmenü
        widget: string
        required: false
      - &id003
        name: hintergrund
        label: Hintergrund
        widget: select
        options:
        - weiss
        - beige
        default: weiss
        required: false
      - &id004
        name: ausblenden
        label: Abschnitt ausblenden
        widget: boolean
        default: false
        required: false
      - name: label
        label: Überzeile
        widget: string
        required: false
      - name: titel
        label: Titel
        widget: string
        required: false
      - name: text
        label: Text ({{open_house_ort}}, {{open_house_zeit}} werden ersetzt)
        widget: string
        required: false
      - name: button_text
        label: Knopftext
        widget: string
        required: false
      - name: hinweis
        label: Hinweis
        widget: hidden
    - name: preise
      label: Preisliste (an/aus in Einstellungen)
      widget: object
      fields:
      - *id001
      - *id002
      - *id003
      - *id004
      - name: label
        label: Überzeile
        widget: string
        required: false
      - name: titel
        label: Titel
        widget: string
        required: false
      - name: text
        label: Text
        widget: text
        required: false
      - name: einheiten
        label: Einheiten
        widget: list
        fields:
        - name: name
          label: Name
          widget: string
          required: false
        - name: preis
          label: Preis
          widget: string
          required: false
        - name: zusatz
          label: Zusatz (z. B. Grundstück)
          widget: string
          required: false
        - {name: flaeche, label: Wohn-/Nutzfläche, widget: string, required: false}
        - {name: zimmer, label: Zimmer, widget: string, required: false}
        - {name: grundstueck, label: Grundstück, widget: string, required: false}
        - {name: status, label: "Status (z. B. reserviert, verkauft – leer = nicht anzeigen)", widget: string, required: false}
      - name: hinweis
        label: Hinweis
        widget: string
        required: false
    - name: energieausweis
      label: Energieausweis (§ 87 GEG)
      widget: object
      fields:
      - *id001
      - *id002
      - *id003
      - *id004
      - name: label
        label: Überzeile
        widget: string
        required: false
      - name: titel
        label: Titel
        widget: string
        required: false
      - name: art
        label: Art des Ausweises
        widget: string
        required: false
      - name: endenergie
        label: Endenergiebedarf in kWh/(m²·a), nur Zahl
        widget: string
        required: false
      - name: energietraeger
        label: Wesentlicher Energieträger
        widget: string
        required: false
      - name: baujahr
        label: Baujahr
        widget: string
        required: false
      - name: effizienzklasse
        label: Effizienzklasse
        widget: string
        required: false
      - name: hinweis
        label: Hinweis
        widget: string
        required: false
    - name: termin
      label: Termin / Einladung
      widget: object
      fields:
      - name: anker
        label: Sprungziel (z. B. kontakt)
        widget: string
        required: false
      - name: sprungmarke
        label: Name im Seitenmenü
        widget: string
        required: false
      - name: hintergrund
        label: Hintergrund
        widget: select
        options:
        - weiss
        - beige
        default: weiss
        required: false
      - name: ausblenden
        label: Abschnitt ausblenden
        widget: boolean
        default: false
        required: false
      - name: datum_gross
        label: Datum groß
        widget: string
      - name: datum_klein
        label: Datum klein
        widget: string
        required: false
      - name: label
        label: Überzeile
        widget: string
        required: false
      - name: titel
        label: Titel
        widget: string
      - name: text
        label: Text
        widget: text
        required: false
      - name: button_text
        label: Knopftext
        widget: string
        required: false
      - name: button_link
        label: Knopf-Link (auch mailto:)
        widget: string
        required: false
    - name: bild_und_text
      label: Bild und Text
      widget: object
      fields:
      - name: anker
        label: Sprungziel (z. B. kontakt)
        widget: string
        required: false
      - name: sprungmarke
        label: Name im Seitenmenü
        widget: string
        required: false
      - name: hintergrund
        label: Hintergrund
        widget: select
        options:
        - weiss
        - beige
        default: weiss
        required: false
      - name: ausblenden
        label: Abschnitt ausblenden
        widget: boolean
        default: false
        required: false
      - name: bild
